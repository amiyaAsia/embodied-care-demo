name: Test and deploy Amiya Care Practice

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage only reviewed browser assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          for asset in index.html tour.css tour-scene.css tour-app.js tour-player.js tour-story.js overview-story.js tour-scene.js assets/amiya-logo.png; do
            test -s "$asset"
            cp "$asset" "dist/$asset"
          done
          for script in tour-app.js tour-player.js tour-story.js overview-story.js tour-scene.js; do
            node --input-type=module --check < "$script"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
