<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="icon" type="image/png" href="assets/amiya-logo.png"><link rel="apple-touch-icon" href="assets/amiya-logo.png">

</head>
<body>
<a class="skip-link" href="#story">Skip to story / 跳至故事</a>
<header class="header"><a href="./" class="brand" aria-label="Amiya Care Practice"><img class="official-logo" src="assets/amiya-logo.png" alt="Amiya"><span>Amiya <strong>Care Practice</strong></span></a><nav class="section-switcher" aria-label="Demonstration sections"><button id="overviewTab" aria-pressed="true" data-en="Overview" data-zh="概览"></button><button id="walkthroughTab" aria-pressed="false" data-en="Full walkthrough" data-zh="完整导览"></button></nav><div class="languages" aria-label="Language / 语言"><button id="english" lang="en" aria-pressed="true">English</button><button id="chinese" lang="zh" aria-pressed="false">中文</button></div></header>
<main id="story">
   <p class="notice" data-en="Guided demonstration · Fictional people and records · No live coaching or backend" data-zh="导览演示 · 人物与记录均为虚构 · 无实时指导或后端服务"></p>
  <section class="chapter-header"><div><p class="eyebrow" id="chapterIndex"></p><h1 id="chapterTitle"></h1><p id="storyFocus"></p></div><button class="chapter-button" id="chaptersButton" aria-haspopup="dialog" data-en="Choose a chapter ↗" data-zh="选择章节 ↗"></button></section>
  <section class="tour-frame" aria-label="Guided story / 导览故事">
    <div class="stage-column"><div id="sceneHost"></div><section id="titleStage" class="title-stage" hidden><img class="title-logo" src="assets/amiya-logo.png" alt="Amiya"><p>Amiya Care Practice</p><h2 id="titleCardHeading"></h2><p id="titleCardSub"></p></section><section id="recordStage" class="record-stage" hidden aria-live="polite" aria-atomic="true" aria-label="Example record / 示例记录"><p class="record-label" id="recordLabel"></p><h2 id="recordTitle"></h2><dl id="recordFields"></dl></section><div id="rewindOverlay" class="rewind-overlay" hidden><span aria-hidden="true">↶</span><strong data-en="Same moment. A different response." data-zh="同一时刻，不同回应。"></strong></div><div class="stage-context" id="stageContext"></div></div>
    <section class="caption-column" id="captionPanel" aria-live="polite" aria-atomic="true"><p class="caption-type" id="captionType"></p><p class="speaker" id="speaker" hidden></p><p class="caption" id="caption"></p><div class="physical-action" id="actionPanel" hidden><span data-en="Physical action" data-zh="身体动作"></span><p id="physicalAction"></p></div><p class="reading-state" id="readingState"></p></section>
  </section>
  <section class="ending-card" id="endingCard" hidden><h2 id="endingHeading"></h2><p id="endingSub"></p><div><button id="fullWalkthroughButton" class="primary" data-en="Watch the full walkthrough" data-zh="观看完整导览"></button><button id="replayButton" data-en="↻ Replay the overview" data-zh="↻ 重播概览"></button><button id="endingChapters" data-en="Choose a chapter" data-zh="选择章节"></button></div></section>
  <div class="player-controls"><div class="main-controls"><button class="primary" id="playButton">▶ Start guided demo</button><button id="restartButton" data-en="↻ Restart" data-zh="↻ 重新开始"></button><button id="readButton" aria-pressed="false">Read aloud: off</button></div><div class="progress-area"><progress id="storyProgress" max="100" value="0" aria-label="Story progress / 故事进度"></progress><span id="stepCount"></span></div></div>
  <p id="playbackNotice" class="playback-notice" role="status"></p>
  <nav class="support-links" aria-label="Supporting information / 支持资料"><button id="carePlanButton" data-en="Fictional care plan" data-zh="虚构照护计划"></button><button id="sourcesButton" data-en="Sources & adaptation" data-zh="参考来源与改编"></button><button id="aboutButton" data-en="About the proposed service" data-zh="关于拟议服务"></button></nav>
  <footer><p data-en="Amiya Care Practice · Understand the concern. Agree on the next step." data-zh="Amiya Care Practice · 理解顾虑，商定下一步。"></p></footer>
</main>
